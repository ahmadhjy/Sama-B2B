name: HelloSama checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hellosama_test
          POSTGRES_PASSWORD: test_only_database_password
          POSTGRES_DB: hellosama_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: 'True'
      DB_NAME: hellosama_test
      DB_USER: hellosama_test
      DB_PASSWORD: test_only_database_password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_SSLMODE: disable
      AI_ENABLED: 'False'
      EMAIL_ENABLED: 'False'
      IMAP_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test portal --noinput
      - run: bash -n deploy/update.sh deploy/worker.sh

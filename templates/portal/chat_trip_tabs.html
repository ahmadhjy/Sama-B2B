<nav class="draft-tabs submitted-trip-tabs" aria-label="Trip conversations">{% for trip in submitted_trips %}<a class="{% if trip.pk == req.pk %}active{% endif %}" href="{% url 'request_detail' trip.pk %}"><strong>{{ trip.title }}</strong><small>{{ trip.get_status_display }} · {{ trip.reference }}</small></a>{% endfor %}{% for draft in open_drafts %}<a href="{% url 'new_request' %}?draft={{ draft.pk }}"><strong>{{ draft.title }}</strong><small>Draft · Not sent</small></a>{% endfor %}{% if not request.user.is_sama %}<a href="{% url 'new_request' %}">＋ Plan another trip</a>{% endif %}</nav>
